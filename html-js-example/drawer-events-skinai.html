<div class="drawer" id="events-drawer">
  <div class="drawer-header">
    <h2>SkinAI Events</h2>
    <button class="close-drawer" onclick="closeDrawers()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="events-header">
    <h3>Event Log <span class="event-count-badge" id="event-count">0</span></h3>
    <button class="clear-button" onclick="clearEvents()">Clear Events</button>
  </div>
  <div class="events-log" id="event-log">
    <div style="text-align: center; padding: 50px 20px; color: #999;">
      <div style="font-size: 3rem; margin-bottom: 15px; opacity: 0.4;">📭</div>
      <div style="font-size: 1rem; font-weight: 500; margin-bottom: 6px; color: #666;">No events yet</div>
      <div style="font-size: 0.85rem; color: #999;">Interact with the SkinAI experience to see events</div>
    </div>
  </div>
</div>
